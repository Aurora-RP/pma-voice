<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<audio id="audio_on" src="mic_click_on.ogg"></audio>
	<audio id="audio_off" src="mic_click_off.ogg"></audio>
	<div id="voice" class="hidden">
		<div id="talkers"></div>
		<div id="more" class="hidden"></div>
		<div id="me">
			<div class="tag">

			</div>
			<div class="me-text">
				<span id="me-label"></span>
				<span id="me-sub"></span>
			</div>
			<div class="bars"><i></i><i></i><i></i></div>
		</div>
	</div>
	<script src="app.js"></script>
</body>
</html>
